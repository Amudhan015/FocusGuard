name: focusguard
description: A focus and accountability app for students.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  installed_apps: ^2.1.1
  uuid: ^4.4.2
  intl: ^0.19.0
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  image: ^4.2.0
  path_provider: ^2.1.4
  file_picker: ^8.0.0
  permission_handler: ^11.3.1
  fl_chart: ^0.69.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
